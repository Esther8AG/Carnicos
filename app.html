<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cárnicos | Punto de venta</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div><span class="brand-mark small">C</span><strong>Cárnicos POS</strong></div>
    <button id="logout" class="secondary">Cerrar sesión</button>
  </header>
  <main class="app-shell">
    <section>
      <div class="section-head"><div><p class="eyebrow">Catálogo</p><h1>Productos</h1></div><input id="search" type="search" placeholder="Buscar producto…"></div>
      <div id="products" class="product-grid"></div>
      <form id="product-form" class="panel form-grid">
        <h2>Agregar producto</h2>
        <label>Nombre<input id="new-name" required></label>
        <label>Precio<input id="new-price" type="number" min="0" step="0.01" required></label>
        <label>Existencias<input id="new-stock" type="number" min="0" step="1" required></label>
        <button type="submit">Guardar producto</button>
      </form>
    </section>
    <aside class="panel cart">
      <p class="eyebrow">Venta actual</p><h2>Carrito</h2>
      <div id="cart-items"></div>
      <div class="total"><span>Total</span><strong id="cart-total">$0</strong></div>
      <button id="checkout" disabled>Finalizar venta</button>
      <p id="message" class="success" aria-live="polite"></p>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
